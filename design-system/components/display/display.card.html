<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 16px; background: var(--surface-page); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Card, Badge, Avatar, Tabs, Skeleton } = window.SentrumDesignSystem_fd9502;

function Demo() {
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '1.2fr 1fr', gap: 16 }}>
      <Card
        title="Squad overview"
        description="Senior squad · 2025/26"
        footer={<span className="snt-microlabel">Updated 2h ago</span>}
      >
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <Avatar fallback="LM" />
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 'var(--text-sm)', fontWeight: 500 }}>L. Martínez</div>
            <div style={{ fontSize: 'var(--text-xs)', color: 'var(--text-muted)' }}>Forward · 24</div>
          </div>
          <Badge>ST</Badge>
          <Badge variant="secondary">U25</Badge>
          <Badge variant="destructive">Expiring</Badge>
        </div>
      </Card>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
        <Tabs
          tabs={[
            { value: 'overview', label: 'Overview' },
            { value: 'stats', label: 'Stats' },
            { value: 'matches', label: 'Matches' },
          ]}
          defaultValue="overview"
        />
        <div style={{ display: 'flex', gap: 8 }}>
          <Badge variant="outline">Loan</Badge>
          <Badge variant="outline">Free agent</Badge>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          <Skeleton style={{ height: 14, width: '70%' }} />
          <Skeleton style={{ height: 14, width: '45%' }} />
          <Skeleton style={{ height: 40 }} />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
