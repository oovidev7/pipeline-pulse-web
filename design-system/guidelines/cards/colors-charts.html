<!-- @dsCard group="Colors" viewport="700x130" name="Charts" subtitle="chart-1…5 — the only saturated colors in the system" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--surface-card); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; align-items: end; height: 84px; }
  .bar { border-radius: var(--radius-sm) var(--radius-sm) 0 0; display: flex; align-items: flex-end; justify-content: center; color: #fff; font-size: 10px; font-family: var(--font-mono); padding-bottom: 4px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="bar" style="background: var(--chart-1); height: 100%;">chart-1</div>
    <div class="bar" style="background: var(--chart-2); height: 82%;">chart-2</div>
    <div class="bar" style="background: var(--chart-3); height: 64%;">chart-3</div>
    <div class="bar" style="background: var(--chart-4); height: 52%; color: #644;">chart-4</div>
    <div class="bar" style="background: var(--chart-5); height: 40%; color: #553;">chart-5</div>
  </div>
</body>
</html>
