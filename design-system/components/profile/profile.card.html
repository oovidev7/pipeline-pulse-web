<!-- @dsCard group="Components" viewport="700x300" name="Profile primitives" subtitle="Eyebrow, StatCard, PercentileBar, Pitch" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 16px; background: var(--zinc-50); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Eyebrow, StatCard, PercentileBar, Pitch } = window.SentrumDesignSystem_fd9502;

function Demo() {
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        <Eyebrow>Season 2025/26 · Eredivisie</Eyebrow>
        <StatCard style={{ padding: '12px 16px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
            <Eyebrow size="sm" dot={false}>Goals</Eyebrow>
            <span style={{ borderRadius: 2, background: 'var(--emerald-50)', padding: '2px 6px', fontFamily: 'var(--font-mono)', fontSize: 9, fontWeight: 600, letterSpacing: '0.05em', color: 'var(--emerald-700)' }}>TOP 5%</span>
          </div>
          <div style={{ fontFamily: 'var(--font-display)', marginTop: 4, fontSize: 24, lineHeight: 1, fontWeight: 600, fontVariantNumeric: 'tabular-nums' }}>14</div>
          <div style={{ marginTop: 6, fontSize: 11, color: 'var(--zinc-500)' }}>0.68 per 90</div>
        </StatCard>
        <StatCard style={{ padding: 16 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 14, alignItems: 'baseline' }}>
            <span style={{ color: 'var(--zinc-700)' }}>Successful dribbles / 90</span>
            <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 600, fontVariantNumeric: 'tabular-nums' }}>5.8 · <span style={{ color: 'var(--emerald-600)' }}>P92</span></span>
          </div>
          <PercentileBar percentile={92} style={{ marginTop: 6 }} />
          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 14, alignItems: 'baseline', marginTop: 10 }}>
            <span style={{ color: 'var(--zinc-700)' }}>Progressive carries / 90</span>
            <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 600, fontVariantNumeric: 'tabular-nums' }}>3.1 · <span style={{ color: '#ca8a04' }}>P61</span></span>
          </div>
          <PercentileBar percentile={61} style={{ marginTop: 6 }} />
        </StatCard>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8, alignItems: 'flex-start' }}>
        <Eyebrow size="sm" dot={false}>Positions</Eyebrow>
        <Pitch
          width={300}
          primary="ST"
          dots={[
            { position: 'ST', percentage: 62 },
            { position: 'LW', percentage: 24 },
            { position: 'AM', percentage: 9 },
          ]}
          ariaLabel="Plays as Striker, Left Winger, Attacking Midfielder"
        />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
